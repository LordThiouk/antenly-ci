name: CI
run-name: CI antenly@${{ inputs.ref || 'main' }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou commit d'antenly (privé) à tester"
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.ref || 'main' }}
  cancel-in-progress: false
jobs:
  # Résout le SHA une seule fois : tous les jobs testent ce commit et le statut y est posé.
  pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.status.outputs.sha }}
    steps:
      - name: Statut pending sur le commit antenly
        id: status
        env:
          GH_TOKEN: ${{ secrets.ANTENLY_TOKEN }}
          REF: ${{ inputs.ref || 'main' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/LordThiouk/antenly/commits/$REF" --jq .sha)
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::SHA antenly invalide pour la ref demandée"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/LordThiouk/antenly/statuses/$SHA" \
            -f state=pending -f context="antenly-ci" -f target_url="$RUN_URL" \
            -f description="CI publique en cours" >/dev/null
          echo "antenly $SHA : pending"
  rust:
    needs: pending
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
  python:
    needs: pending
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
  # ISC-5 (ISA 2026-11-02-capture-corpus-24h) : vrai inaSpeechSegmenter + TensorFlow CPU,
  # test_segmente_la_fixture_synthetique doit tourner, un skip est un échec.
  preannot-ina:
    needs: pending
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: false
      # Le pipeline n'existe pas sur tous les SHA (absent d'antenly/main au 2026-11-06) :
      # sans lui, le job passe avec une notice au lieu de rougir des PR sans rapport.
      - name: Pipeline preannot présent ?
        id: preannot
        run: |
          if [ -f scripts/corpus/preannot/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::scripts/corpus/preannot absent sur ce SHA : preannot-ina sans objet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.preannot.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/corpus/preannot/requirements.txt
      - name: ffmpeg (binaire statique, sans miroirs Ubuntu)
        id: ffmpeg
        if: steps.preannot.outputs.present == 'true'
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        continue-on-error: true
        timeout-minutes: 10
        with:
          ffmpeg-version: release
      - name: ffmpeg (secours apt)
        if: steps.preannot.outputs.present == 'true' && steps.ffmpeg.outcome != 'success'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Recette de requirements.txt, version ina de la branche tools/preannot. Pas de
      # --no-cache-dir : sans répertoire de cache, le Post Run de `cache: pip` échoue.
      - name: Dépendances ina + TensorFlow CPU
        if: steps.preannot.outputs.present == 'true'
        run: |
          python -m pip install -r scripts/corpus/preannot/requirements.txt "pytest>=8"
          python -m pip install --no-deps inaSpeechSegmenter==0.8.0
          python -c "import inaSpeechSegmenter, tensorflow as tf; print('tensorflow', tf.__version__)"
      - name: test_preannot_pipeline.py avec le vrai segmenteur
        if: steps.preannot.outputs.present == 'true'
        working-directory: api
        run: |
          python -m pytest tests/capture/test_preannot_pipeline.py -rs --junitxml=preannot.xml
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("preannot.xml").iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          ran = any(c.get("name") == "test_segmente_la_fixture_synthetique" for c in cases)
          if skipped or not ran:
              sys.exit(f"skip interdit : {skipped} ; test ina exécuté : {ran}")
          print(f"{len(cases)} tests, 0 skip, segmenteur ina réel exécuté")
          EOF
  licenses:
    needs: pending
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/Cargo.toml
          command: check licenses
      - uses: astral-sh/setup-uv@v5
      - name: Python licences (deny GPL/AGPL)
        working-directory: api
        run: |
          uv sync
          uv run pip-licenses --partial-match --fail-on="GNU General Public License;GPL;AGPL;Affero"
  secrets:
    needs: pending
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config du dépôt (décision Papa 2026-11-04) : seule exception,
          # les fichiers de test et fixtures.
          GITLEAKS_CONFIG: .gitleaks.toml
  report-status:
    needs: [pending, rust, python, preannot-ina, licenses, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Statut sur le commit antenly
        env:
          GH_TOKEN: ${{ secrets.ANTENLY_TOKEN }}
          SHA: ${{ needs.pending.outputs.sha }}
          REF: ${{ inputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: |
          set -euo pipefail
          if [ -z "$SHA" ]; then
            # Sinon le pending posé par pr-dispatch resterait bloqué sur ce SHA.
            if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
              gh api -X POST "repos/LordThiouk/antenly/statuses/$REF" \
                -f state=error -f context="antenly-ci" -f target_url="$RUN_URL" \
                -f description="Job pending en échec : relancer ci.yml avec ce SHA" >/dev/null
            fi
            echo "::error::SHA antenly non résolu (job pending en échec)"
            exit 1
          fi
          STATE=$([ "$OK" = "true" ] && echo success || echo failure)
          gh api -X POST "repos/LordThiouk/antenly/statuses/$SHA" \
            -f state="$STATE" -f context="antenly-ci" -f target_url="$RUN_URL" \
            -f description="CI publique (rust, python, preannot-ina, licences, secrets)" >/dev/null
          echo "antenly $SHA : $STATE"
