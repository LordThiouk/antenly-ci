name: CI
run-name: CI antenly@${{ inputs.ref || 'main' }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou commit d'antenly (privé) à tester"
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.ref || 'main' }}
  cancel-in-progress: false
jobs:
  # Résout le SHA une seule fois : tous les jobs testent ce commit et le statut y est posé.
  pending:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.status.outputs.sha }}
    steps:
      - name: Statut pending sur le commit antenly
        id: status
        env:
          GH_TOKEN: ${{ secrets.ANTENLY_TOKEN }}
          REF: ${{ inputs.ref || 'main' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/LordThiouk/antenly/commits/$REF" --jq .sha)
          gh api -X POST "repos/LordThiouk/antenly/statuses/$SHA" \
            -f state=pending -f context="antenly-ci" -f target_url="$RUN_URL" \
            -f description="CI publique en cours" >/dev/null
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "antenly $SHA : pending"
  rust:
    needs: pending
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
  python:
    needs: pending
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
  licenses:
    needs: pending
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: true
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/Cargo.toml
          command: check licenses
      - uses: astral-sh/setup-uv@v5
      - name: Python licences (deny GPL/AGPL)
        working-directory: api
        run: |
          uv sync
          uv run pip-licenses --partial-match --fail-on="GNU General Public License;GPL;AGPL;Affero"
  secrets:
    needs: pending
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ needs.pending.outputs.sha }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config du dépôt (décision Papa 2026-11-04) : seule exception,
          # les fichiers de test et fixtures.
          GITLEAKS_CONFIG: .gitleaks.toml
  report-status:
    needs: [pending, rust, python, licenses, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Statut sur le commit antenly
        env:
          GH_TOKEN: ${{ secrets.ANTENLY_TOKEN }}
          SHA: ${{ needs.pending.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: |
          set -euo pipefail
          if [ -z "$SHA" ]; then echo "::error::SHA antenly non résolu (job pending en échec)"; exit 1; fi
          STATE=$([ "$OK" = "true" ] && echo success || echo failure)
          gh api -X POST "repos/LordThiouk/antenly/statuses/$SHA" \
            -f state="$STATE" -f context="antenly-ci" -f target_url="$RUN_URL" \
            -f description="CI publique (rust, python, licences, secrets)" >/dev/null
          echo "antenly $SHA : $STATE"
