name: CI scripts
# Tests des scripts opencode de CE dépôt sur un runner hébergé (PR et main), dont le chemin de production de
# done_check.sh (/opt/fullrun-tools, root) avec OC_REQUIRE_PROD_TESTS=1. Distinct de ci.yml, qui teste antenly
# lui-même et ne se lance qu'à la demande.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-scripts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # leaklog-test / livelog-test exigent `age` (chiffrement du journal) ; sans lui ils
      # échouent en « age absent ». Même binaire épinglé + sha256 que le workflow FullRun.
      - name: Installer age (épinglé, sha256 vérifié)
        env:
          AGE_VERSION: "1.2.1"
          AGE_SHA256: "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/age.tgz"
          curl -sSfL -o "$f" "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $f" | sha256sum -c --quiet
          tar -xzf "$f" -C "$RUNNER_TEMP" age/age age/age-keygen
          sudo install -m 0755 "$RUNNER_TEMP/age/age" /usr/local/bin/age
          sudo install -m 0755 "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/age-keygen
          age --version
      # done_check.sh lit le verdict via le CLI lifeos (source unique, LIFEOS/TOOLS/FullRunVerdict.ts) :
      # les tests qui font tourner le vrai done_check.sh en ont besoin, avec bun.
      - name: Checkout LifeOS (lecture seule, CLI de verdict)
        uses: actions/checkout@v4
        with:
          repository: LordThiouk/lifeos
          # Épinglé : merge de lifeos#23 (CLI de verdict). Un `main` mouvant changerait le verdict sous nos pieds.
          ref: 109e42353e52a518d91c8ea680bc982482c38f12
          token: ${{ secrets.LIFEOS_READ_TOKEN }}
          path: lifeos
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # Marqueur root (non inscriptible) sans lequel done_check.sh refuse le mode test sous GITHUB_ACTIONS :
      # posé ici pour la seule suite de tests, jamais par opencode-fullrun.yml.
      - name: Marqueur root du mode test (suite de tests seulement)
        run: sudo install -o root -g root -m 0644 /dev/null /etc/fullrun-done-test-mode
      - name: Tests opencode
        env:
          OC_VERDICT_CLI: ${{ github.workspace }}/lifeos/LIFEOS/TOOLS/FullRunVerdict.ts
          OC_REQUIRE_PROD_TESTS: "1"
        run: |
          set -euo pipefail
          failed=0
          for t in opencode/tests/*-test.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "ok $t"
            else
              echo "::error::$t a échoué"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
