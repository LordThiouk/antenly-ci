name: opencode FullRun
run-name: FullRun ${{ inputs.job_name }} → antenly@${{ inputs.branch }}

# Longs jobs opencode (FullRun LifeOS) pour le dépôt privé LordThiouk/antenly.
# Dépôt PUBLIC : logs visibles par tous. La sortie d'opencode reste dans un fichier du
# runner, jamais affichée ni publiée en artifact. Déclenchement manuel uniquement.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche de fonctionnalité d'antenly, déjà poussée (jamais main/master)"
        required: true
        type: string
      prompt_path:
        description: "Prompt : antenly:<chemin dans antenly> ou ci:<chemin dans antenly-ci>"
        required: true
        type: string
      job_name:
        description: "Nom du job (lettres, chiffres, - _ .) ; rapport .fullrun/<job>_DONE.md"
        required: true
        type: string
      model_main:
        description: "Modèle principal et Forge (gratuit opencode uniquement)"
        type: string
        default: opencode/deepseek-v4.1-flash-free
      model_max:
        description: "Modèle de Max (gratuit opencode uniquement)"
        type: string
        default: opencode/mimo-v2.6-flash-free
      model_fallback:
        description: "Repli, seulement si le principal échoue sur un 429"
        type: string
        default: opencode/glm-5.3-flash-free
      lifeos_ref:
        description: "Branche de LordThiouk/lifeos (skills, agents, config opencode privée)"
        type: string
        default: main
      isa_path:
        description: "ISA suivie (MEMORY/WORK/<dossier>/ISA.md) ; vide = déduite du prompt"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: opencode-fullrun-${{ inputs.branch }}
  cancel-in-progress: false

env:
  OPENCODE_VERSION: "1.19.4"
  BUN_VERSION: "1.4.4"
  GITLEAKS_VERSION: "8.30.1"
  RIPGREP_VERSION: "14.1.1"
  RIPGREP_SHA256: "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  fullrun:
    if: github.actor == 'LordThiouk' && github.triggering_actor == 'LordThiouk'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IN_BRANCH: ${{ inputs.branch }}
      IN_PROMPT: ${{ inputs.prompt_path }}
      IN_JOB: ${{ inputs.job_name }}
      OC_MODEL_MAIN: ${{ inputs.model_main }}
      OC_MODEL_MAX: ${{ inputs.model_max }}
      OC_MODEL_FALLBACK: ${{ inputs.model_fallback }}
      IN_LIFEOS_REF: ${{ inputs.lifeos_ref }}
      OC_ISA_PATH: ${{ inputs.isa_path }}
      ANTENLY_DIR: ${{ github.workspace }}/antenly
      CI_DIR: ${{ github.workspace }}/ci
      OPENCODE_DISABLE_AUTOUPDATE: "1"
    steps:
      - name: Garde des entrées (branche, modèles gratuits, chemins)
        run: |
          set +x
          fail() { echo "::error::$1"; exit 1; }
          [[ "$IN_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || fail "branche invalide"
          case "${IN_BRANCH,,}" in
            main|master|head|refs/*|*..*|*/|*.lock) fail "branche interdite : seule une branche de fonctionnalité est acceptée" ;;
          esac
          [[ "$IN_JOB" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || fail "job_name invalide"
          [[ "$IN_PROMPT" =~ ^(antenly|ci):[A-Za-z0-9._/-]+$ && "$IN_PROMPT" != *..* ]] || fail "prompt_path invalide (antenly:<chemin> ou ci:<chemin>)"
          [[ "$IN_LIFEOS_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ && "$IN_LIFEOS_REF" != *..* ]] || fail "lifeos_ref invalide"
          if [ -n "$OC_ISA_PATH" ]; then
            [[ "$OC_ISA_PATH" =~ ^MEMORY/WORK/[A-Za-z0-9._-]+/ISA\.md$ && "$OC_ISA_PATH" != *..* ]] \
              || fail "isa_path invalide (MEMORY/WORK/<dossier>/ISA.md)"
          fi
          for m in "$OC_MODEL_MAIN" "$OC_MODEL_MAX" "$OC_MODEL_FALLBACK"; do
            [[ "$m" =~ ^opencode/[a-z0-9.-]+-free$ ]] || fail "modèle refusé : seuls les modèles opencode/*-free sont admis"
          done
          echo "OC_WORK=$RUNNER_TEMP/oc" >> "$GITHUB_ENV"
          echo "Entrées valides : branche $IN_BRANCH, job $IN_JOB"

      - name: Checkout antenly-ci
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - name: Checkout antenly (lecture seule)
        uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          path: antenly
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout LifeOS (lecture seule)
        uses: actions/checkout@v4
        with:
          repository: LordThiouk/lifeos
          ref: ${{ inputs.lifeos_ref }}
          token: ${{ secrets.LIFEOS_READ_TOKEN }}
          path: lifeos
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v5

      - name: Installer opencode (version de la box)
        run: |
          npm install -g --no-fund --no-audit "opencode-ai@${OPENCODE_VERSION}" >/dev/null 2>&1
          v=$(opencode --version 2>/dev/null | tail -n1)
          [ "$v" = "$OPENCODE_VERSION" ] || { echo "::error::opencode $v au lieu de $OPENCODE_VERSION"; exit 1; }
          echo "opencode $v"

      - name: Installer ripgrep (épinglé, sha256 vérifié)
        run: |
          f="$RUNNER_TEMP/rg.tgz"
          curl -sSfL -o "$f" "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RIPGREP_SHA256}  $f" | sha256sum -c --quiet
          tar -xzf "$f" -C "$RUNNER_TEMP" "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"
          sudo install -m 0755 "$RUNNER_TEMP/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version | head -n1

      - name: Reconstituer ~/.claude et ~/.config/opencode
        run: |
          set +x
          L="$GITHUB_WORKSPACE/lifeos"
          [ -d "$L/opencode/agent" ] || { echo "::error::lifeos@$IN_LIFEOS_REF sans dossier opencode/"; exit 1; }
          mkdir -p "$HOME/.claude" "$HOME/.config/opencode" "$HOME/.local/share/opencode-lifeos" \
                   "$HOME/.claude/LIFEOS/MEMORY/STATE"
          rsync -a --exclude /.git --exclude /secrets --exclude /opencode "$L/" "$HOME/.claude/"
          cp "$L/settings.template.json" "$HOME/.claude/settings.json"
          (cd "$HOME/.claude" && bun install --silent >/dev/null 2>&1) || echo "::warning::bun install ~/.claude incomplet"
          C="$HOME/.config/opencode"
          cp "$CI_DIR/opencode/config/opencode.json" "$C/opencode.json"
          cp -r "$L/opencode/agent" "$L/opencode/command" "$L/opencode/plugins" "$C/"
          cp "$L/opencode/package.json" "$C/package.json"
          cp "$L/opencode/nix-lifeos.prompt.md" "$HOME/.local/share/opencode-lifeos/"
          (cd "$C" && bun install --silent >/dev/null 2>&1) || { echo "::error::bun install ~/.config/opencode KO"; exit 1; }
          # Modèles : Max sur model_max, tous les autres agents sur model_main.
          for f in "$C"/agent/*.md; do
            m="$OC_MODEL_MAIN"; [ "$(basename "$f")" = "Max.md" ] && m="$OC_MODEL_MAX"
            sed -i -E "0,/^model: .*/s##model: ${m}#" "$f"
          done
          # Les agents générés citent /home/box : lien vers le HOME du runner.
          [ -e /home/box ] || sudo ln -s "$HOME" /home/box
          echo "Config LifeOS/opencode en place"

      - name: Clé d'empreinte ISA
        env:
          ISA_STAMP_KEY: ${{ secrets.ISA_STAMP_KEY }}
        run: |
          set +x
          [ -n "${ISA_STAMP_KEY:-}" ] || { echo "::error::secret ISA_STAMP_KEY absent (acte Papa requis)"; exit 1; }
          echo "::add-mask::$ISA_STAMP_KEY"
          K="$HOME/.claude/LIFEOS/MEMORY/STATE/.isa-stamp-key"
          ( umask 077; printf '%s' "$ISA_STAMP_KEY" > "$K" )
          [ "$(tr -d '\n' < "$K" | wc -c)" -ge 64 ] || { echo "::error::ISA_STAMP_KEY trop courte (64 hex attendus)"; exit 1; }
          echo "Clé ISA écrite (0600)"

      - name: Préparer le dépôt antenly et le prompt
        id: prep
        run: |
          set +x
          cd "$ANTENLY_DIR"
          # shellcheck disable=SC2153 # IN_BRANCH vient de l'env du job
          [ "$(git rev-parse --abbrev-ref HEAD)" = "$IN_BRANCH" ] || git checkout -q -B "$IN_BRANCH" "origin/$IN_BRANCH"
          git config user.name "Nix"
          git config user.email "nix@antenly.local"
          # Aucun remote utilisable par l'IA : le push final ajoute ses propres identifiants.
          printf '#!/bin/sh\necho "push interdit pendant le run opencode" >&2\nexit 1\n' > .git/hooks/pre-push
          chmod +x .git/hooks/pre-push
          mkdir -p "$OC_WORK"
          # SHA de départ en sortie de step : opencode peut écrire dans $GITHUB_ENV, pas ici.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          src="${IN_PROMPT%%:*}"; rel="${IN_PROMPT#*:}"
          if [ "$src" = antenly ]; then root="$ANTENLY_DIR"; else root="$CI_DIR"; fi
          p=$(realpath -e "$root/$rel" 2>/dev/null) || { echo "::error::prompt introuvable"; exit 1; }
          case "$p" in "$root"/*) ;; *) echo "::error::prompt hors du dépôt"; exit 1 ;; esac
          export OC_BRANCH="$IN_BRANCH" OC_JOB="$IN_JOB" OC_REPORT="$OC_WORK/REPORT.md"
          # shellcheck disable=SC2016 # liste de variables pour envsubst, pas une expansion
          envsubst '$ANTENLY_DIR $OC_BRANCH $OC_REPORT $OC_JOB $OC_MODEL_MAIN $OC_MODEL_MAX' \
            < "$CI_DIR/opencode/ci-preamble.md" > "$OC_WORK/prompt.md"
          cat "$p" >> "$OC_WORK/prompt.md"
          echo "Prompt prêt ($(wc -l < "$OC_WORK/prompt.md") lignes), base $(git rev-parse --short HEAD)"

      - name: opencode run (sortie jamais affichée, suivi filtré toutes les 10 min)
        id: oc
        continue-on-error: true
        timeout-minutes: 320
        env:
          OC_JOB: ${{ inputs.job_name }}
          OC_BRANCH: ${{ inputs.branch }}
          OC_PROMPT_FILE: ${{ runner.temp }}/oc/prompt.md
          OC_REPORT: ${{ runner.temp }}/oc/REPORT.md
          OC_LOG: ${{ runner.temp }}/oc/opencode.log
          OC_DEADLINE_MIN: "310"
          OC_PROGRESS_INTERVAL: "600"
          BASE_SHA: ${{ steps.prep.outputs.base }}
        run: |
          set +x
          # Suivi : lignes [suivi] à valeurs filtrées (liste blanche / nombres), jamais le log lui-même.
          OC_START=$(date +%s); OC_PARENT_PID=$$; export OC_START OC_PARENT_PID
          "$CI_DIR/opencode/progress.sh" start || true
          "$CI_DIR/opencode/progress.sh" loop & mon=$!
          rc=0; "$CI_DIR/opencode/run-fullrun.sh" || rc=$?
          kill "$mon" 2>/dev/null || true; wait "$mon" 2>/dev/null || true
          "$CI_DIR/opencode/progress.sh" once fin || true
          if [ "$rc" -eq 0 ]; then
            echo "opencode : terminé (code 0)"
          else
            echo "opencode : arrêt non nul (code $rc), détails dans le rapport et le journal poussés sur la branche"
            exit 1
          fi

      - name: Rapport, journal privé et contrôles avant push
        id: check
        if: always() && steps.prep.outputs.base != ''
        env:
          OC_OUTCOME: ${{ steps.oc.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Valeurs du step > $GITHUB_ENV : opencode ne peut ni changer la branche, ni la base,
          # ni injecter BASH_ENV / LD_PRELOAD dans les steps de contrôle et de push.
          IN_BRANCH: ${{ inputs.branch }}
          IN_JOB: ${{ inputs.job_name }}
          BASE_SHA: ${{ steps.prep.outputs.base }}
          OC_WORK: ${{ runner.temp }}/oc
          ANTENLY_DIR: ${{ github.workspace }}/antenly
          CI_DIR: ${{ github.workspace }}/ci
          ISA_STAMP_KEY: ${{ secrets.ISA_STAMP_KEY }}
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set +x
          # PATH fixe : $GITHUB_PATH (écrit par opencode) ne doit pas remplacer git, grep, curl…
          export PATH=/usr/local/bin:/usr/bin:/bin
          cd "$ANTENLY_DIR"
          # Hooks et fsmonitor du dépôt neutralisés : l'IA a pu les écrire dans .git/config.
          G=(git -c core.hooksPath=/dev/null -c core.fsmonitor=false)
          br=$(git rev-parse --abbrev-ref HEAD)
          [ "$br" = "$IN_BRANCH" ] || { echo "::error::opencode a changé de branche : push refusé"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo "::error::historique réécrit depuis le SHA de départ : push refusé"; exit 1; }
          if git diff --name-only "$BASE_SHA" HEAD | grep -q '^\.github/workflows/'; then
            echo "::error::modification de .github/workflows : push refusé"; exit 1
          fi
          # Travail non commité : conservé dans un commit explicite pour la reprise.
          if [ -n "$("${G[@]}" status --porcelain)" ]; then
            "${G[@]}" add -A
            "${G[@]}" commit -q -m "wip(ci): état non commité à la fin du run $IN_JOB" || true
          fi
          R=".fullrun/${IN_JOB}_DONE.md"
          LOGREL=".fullrun/logs/${IN_JOB}-${GITHUB_RUN_ID}.log"
          # Pas d'écriture à travers un lien symbolique posé par l'IA (ex. vers .git/config).
          for p in .fullrun .fullrun/logs "$R" "$LOGREL"; do
            [ ! -L "$p" ] || { echo "::error::lien symbolique inattendu dans .fullrun : push refusé"; exit 1; }
          done
          mkdir -p .fullrun/logs "$OC_WORK"
          # Clé ISA prise du secret (pas du fichier de $HOME, modifiable par l'IA).
          K="$OC_WORK/isa-check.key"; ( umask 077; printf '%s' "${ISA_STAMP_KEY:-}" > "$K" )
          trap 'rm -f "$K" "$OC_WORK/run.diff"' EXIT
          {
            echo "# Run CI $IN_JOB"
            echo
            echo "- run : $RUN_URL"
            echo "- fin : $(TZ=Africa/Dakar date '+%Y-%m-%d %H:%M') (Dakar)"
            echo "- branche : $IN_BRANCH ; base \`$BASE_SHA\`"
            echo "- opencode : $OC_OUTCOME ; $(tr '\n' ' ' 2>/dev/null < "$OC_WORK/opencode.log.status" || echo 'pas de statut')"
            echo "- modèles : main/Forge $OC_MODEL_MAIN, Max $OC_MODEL_MAX, repli $OC_MODEL_FALLBACK"
            echo "- journal complet : \`$LOGREL\` (commit suivant ; absent s'il a été retiré par le contrôle anti-secrets)"
            echo
            echo "## Commits du run"
            git log --format='- %h %s' "$BASE_SHA..HEAD" || true
            echo
            echo "## Rapport de l'agent"
            if [ -s "$OC_WORK/REPORT.md" ]; then cat "$OC_WORK/REPORT.md"; else echo "(aucun rapport écrit : relancer avec le même prompt pour reprendre)"; fi
          } > "$R"
          "${G[@]}" add -- "$R"
          "${G[@]}" commit -q -m "chore(ci): rapport du run $IN_JOB" || true
          # Journal opencode complet (sans ANSI, jetons masqués, 5 Mo max), commité en DERNIER :
          # il passe les mêmes contrôles que le reste et peut être retiré seul s'il est signalé.
          log_state="absent"; log_commit=""
          if [ -s "$OC_WORK/opencode.log" ] && OC_ISA_KEY_FILE="$K" "$CI_DIR/opencode/redact-log.sh" "$OC_WORK/opencode.log" "$LOGREL"; then
            "${G[@]}" add -f -- "$LOGREL"
            if "${G[@]}" commit -q -m "chore(ci): journal opencode du run $IN_JOB ($GITHUB_RUN_ID)"; then
              log_commit=$(git rev-parse HEAD); log_state="commité"
            fi
          fi
          # Secrets : gitleaks sur les seuls commits du run, sortie jamais affichée.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          # Config et ignores pris au SHA de départ : l'IA ne peut pas assouplir le contrôle.
          cfg=()
          if git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaks.toml" > "$OC_WORK/gitleaks.toml"; cfg=(--config "$OC_WORK/gitleaks.toml")
          fi
          mkdir -p "$OC_WORK/gl-ignore"
          if git cat-file -e "$BASE_SHA:.gitleaksignore" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaksignore" > "$OC_WORK/gl-ignore/.gitleaksignore"
          fi
          # Scan dans un dépôt nu neuf : ni .git/config ni attributs du run (diff.external,
          # textconv…) ne peuvent masquer un contenu à gitleaks ou à la recherche de la clé.
          S="$RUNNER_TEMP/scan.git"
          snap() {
            rm -rf "$S" && git init -q --bare "$S" \
              && git -C "$S" fetch -q --no-tags "file://$ANTENLY_DIR" "+refs/heads/$IN_BRANCH:refs/heads/$IN_BRANCH" >/dev/null 2>&1 \
              && [ "$(git -C "$S" rev-parse "refs/heads/$IN_BRANCH")" = "$(git rev-parse HEAD)" ]
          }
          # 0 = propre, 1 = gitleaks, 2 = clé ISA (64 hex, non détectable par gitleaks).
          scan() {
            snap || return 3
            "$RUNNER_TEMP/gitleaks" git "${cfg[@]}" --gitleaks-ignore-path "$OC_WORK/gl-ignore" \
              --log-opts="$BASE_SHA..refs/heads/$IN_BRANCH" --redact --no-banner \
              --report-path "$OC_WORK/gitleaks.json" "$S" >/dev/null 2>&1 || return 1
            if [ -s "$K" ]; then
              git -C "$S" log -p --binary --no-ext-diff --no-textconv --format= "$BASE_SHA..refs/heads/$IN_BRANCH" > "$OC_WORK/run.diff"
              if grep -qiF -- "$(tr -d '\n' < "$K")" "$OC_WORK/run.diff"; then return 2; fi
            fi
            return 0
          }
          why() {
            case "$1" in 2) echo "la clé ISA apparaît" ;; 3) echo "copie de contrôle impossible" ;; *) echo "gitleaks a trouvé un secret probable" ;; esac
          }
          src=0; scan || src=$?
          if [ "$src" -ne 0 ]; then
            if [ -n "$log_commit" ] && [ "$(git rev-parse HEAD)" = "$log_commit" ]; then
              # Seul notre commit de journal est retiré ; le reste est recontrôlé avant tout push.
              "${G[@]}" reset -q --hard HEAD~1
              log_state="retiré (contrôle anti-secrets)"
              echo "::warning::$(why "$src") dans les commits du run : journal retiré, recontrôle du reste"
              src=0; scan || src=$?
              [ "$src" -eq 0 ] || { echo "::error::$(why "$src") hors journal : push refusé"; exit 1; }
            else
              echo "::error::$(why "$src") dans les commits du run : push refusé"; exit 1
            fi
          fi
          {
            echo "commits=$(git rev-list --count "$BASE_SHA..HEAD")"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "- Journal opencode privé : ${log_state} (\`$LOGREL\` sur antenly@$IN_BRANCH)" >> "$GITHUB_STEP_SUMMARY"
          echo "Contrôles OK : $(git rev-list --count "$BASE_SHA..HEAD") commit(s) à pousser ; journal ${log_state}"

      - name: Push sur la branche de fonctionnalité (jamais main, jamais force)
        if: always() && steps.check.outcome == 'success'
        env:
          PUSH_TOKEN: ${{ secrets.ANTENLY_PUSH_TOKEN }}
          HEAD_SHA: ${{ steps.check.outputs.head }}
          IN_BRANCH: ${{ inputs.branch }}
          ANTENLY_DIR: ${{ github.workspace }}/antenly
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set +x
          export PATH=/usr/bin:/bin
          # Mêmes règles que la garde d'entrée, revérifiées ici (la valeur vient de l'entrée, pas de $GITHUB_ENV).
          [[ "$IN_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || { echo "::error::branche invalide : push refusé"; exit 1; }
          case "${IN_BRANCH,,}" in
            main|master|head|refs/*|*..*|*/|*.lock) echo "::error::branche interdite : push refusé"; exit 1 ;;
          esac
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA contrôlé absent : push refusé"; exit 1; }
          [ -n "${PUSH_TOKEN:-}" ] || { echo "::error::secret ANTENLY_PUSH_TOKEN absent (acte Papa requis)"; exit 1; }
          # Push depuis un dépôt nu neuf : ni .git/config ni ~/.gitconfig (écrits par l'IA) ne s'appliquent.
          B="$RUNNER_TEMP/push.git"; rm -rf "$B"
          env -u PUSH_TOKEN git init -q --bare "$B"
          env -u PUSH_TOKEN git -C "$B" -c protocol.file.allow=always fetch -q --no-tags \
            "file://$ANTENLY_DIR" "+refs/heads/$IN_BRANCH:refs/heads/$IN_BRANCH" >/dev/null 2>&1 \
            || { echo "::error::copie locale des commits contrôlés impossible : push refusé"; exit 1; }
          [ "$(git -C "$B" rev-parse "refs/heads/$IN_BRANCH")" = "$HEAD_SHA" ] \
            || { echo "::error::la branche a bougé après les contrôles : push refusé"; exit 1; }
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # En-tête passé par l'environnement de git seul (pas en argument visible dans ps), env vidé
          # des proxys / GIT_* qu'opencode aurait pu poser via $GITHUB_ENV.
          if env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
               GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=2 \
               GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null \
               GIT_CONFIG_KEY_1=http.https://github.com/.extraheader GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth" \
               /usr/bin/git -C "$B" push --no-verify --porcelain "https://github.com/LordThiouk/antenly.git" \
               "$HEAD_SHA:refs/heads/$IN_BRANCH" >/dev/null 2>&1; then
            echo "Push OK : antenly@$IN_BRANCH → ${HEAD_SHA:0:7}"
          else
            echo "::error::push refusé (branche avancée ailleurs, ou jeton sans droit) : rien n'a été forcé"; exit 1
          fi

      - name: Statut final
        if: always()
        env:
          OC_OUTCOME: ${{ steps.oc.outcome }}
        run: |
          echo "opencode : ${OC_OUTCOME:-non lancé}"
          [ "$OC_OUTCOME" = success ] || exit 1
