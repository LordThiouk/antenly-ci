name: opencode FullRun
run-name: FullRun ${{ inputs.job_name }} → antenly@${{ inputs.branch }}

# Longs jobs opencode (FullRun LifeOS) pour le dépôt privé LordThiouk/antenly.
# Dépôt PUBLIC : logs visibles par tous. La sortie d'opencode reste dans un fichier du
# runner, jamais affichée ni publiée en artifact. Déclenchement manuel uniquement.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche de fonctionnalité d'antenly, déjà poussée (jamais main/master)"
        required: true
        type: string
      prompt_path:
        description: "Prompt : antenly:<chemin dans antenly> ou ci:<chemin dans antenly-ci>"
        required: true
        type: string
      job_name:
        description: "Nom du job (lettres, chiffres, - _ .) ; rapport .fullrun/<job>_DONE.md"
        required: true
        type: string
      model_main:
        description: "Modèle principal et Forge (gratuit opencode uniquement)"
        type: string
        default: opencode/deepseek-v4.1-flash-free
      model_max:
        description: "Modèle de Max (gratuit opencode uniquement)"
        type: string
        default: opencode/mimo-v2.6-flash-free
      model_fallback:
        description: "Repli, seulement si le principal échoue sur un 429"
        type: string
        default: opencode/glm-5.3-flash-free
      lifeos_ref:
        description: "Branche de LordThiouk/lifeos (skills, agents, config opencode privée)"
        type: string
        default: main
      isa_path:
        description: "ISA suivie (MEMORY/WORK/<dossier>/ISA.md) ; vide = déduite du prompt"
        type: string
        default: ""
      idle_minutes:
        description: "Garde-fou : arrêt si le journal opencode n'écrit plus rien pendant N min (10 à 120)"
        type: string
        default: "30"

permissions:
  contents: read

concurrency:
  group: opencode-fullrun-${{ inputs.branch }}
  cancel-in-progress: false

env:
  OPENCODE_VERSION: "1.19.4"
  BUN_VERSION: "1.4.4"
  GITLEAKS_VERSION: "8.30.1"
  RIPGREP_VERSION: "14.1.1"
  RIPGREP_SHA256: "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e"
  RTK_VERSION: "1.2.0"
  RTK_SHA256: "70fee7b4a548c43dde94c77e2335550981b0bc2fb013691d8c8109b5bd0eda37"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  fullrun:
    if: github.actor == 'LordThiouk' && github.triggering_actor == 'LordThiouk'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IN_BRANCH: ${{ inputs.branch }}
      IN_PROMPT: ${{ inputs.prompt_path }}
      IN_JOB: ${{ inputs.job_name }}
      OC_MODEL_MAIN: ${{ inputs.model_main }}
      OC_MODEL_MAX: ${{ inputs.model_max }}
      OC_MODEL_FALLBACK: ${{ inputs.model_fallback }}
      IN_LIFEOS_REF: ${{ inputs.lifeos_ref }}
      OC_ISA_PATH: ${{ inputs.isa_path }}
      IN_IDLE_MIN: ${{ inputs.idle_minutes }}
      ANTENLY_DIR: ${{ github.workspace }}/antenly
      CI_DIR: ${{ github.workspace }}/ci
      OPENCODE_DISABLE_AUTOUPDATE: "1"
    steps:
      - name: Garde des entrées (branche, modèles gratuits, chemins)
        id: guard
        run: |
          set +x
          fail() { echo "::error::$1"; exit 1; }
          [[ "$IN_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || fail "branche invalide"
          case "${IN_BRANCH,,}" in
            main|master|head|refs/*|*..*|*/|*.lock|fullrun-logs/*) fail "branche interdite : seule une branche de fonctionnalité est acceptée" ;;
          esac
          [[ "$IN_JOB" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || fail "job_name invalide"
          [[ "$IN_PROMPT" =~ ^(antenly|ci):[A-Za-z0-9._/-]+$ && "$IN_PROMPT" != *..* ]] || fail "prompt_path invalide (antenly:<chemin> ou ci:<chemin>)"
          [[ "$IN_LIFEOS_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ && "$IN_LIFEOS_REF" != *..* ]] || fail "lifeos_ref invalide"
          if [ -n "$OC_ISA_PATH" ]; then
            [[ "$OC_ISA_PATH" =~ ^MEMORY/WORK/[A-Za-z0-9._-]+/ISA\.md$ && "$OC_ISA_PATH" != *..* ]] \
              || fail "isa_path invalide (MEMORY/WORK/<dossier>/ISA.md)"
          fi
          if ! [[ "$IN_IDLE_MIN" =~ ^[0-9]{2,3}$ ]] || [ "$((10#$IN_IDLE_MIN))" -lt 10 ] || [ "$((10#$IN_IDLE_MIN))" -gt 120 ]; then
            fail "idle_minutes invalide (entier de 10 à 120)"
          fi
          for m in "$OC_MODEL_MAIN" "$OC_MODEL_MAX" "$OC_MODEL_FALLBACK"; do
            [[ "$m" =~ ^opencode/[a-z0-9.-]+-free$ ]] || fail "modèle refusé : seuls les modèles opencode/*-free sont admis"
          done
          echo "OC_WORK=$RUNNER_TEMP/oc" >> "$GITHUB_ENV"
          # Début du job (pour le plafond d'opencode et la durée notifiée) : sortie de step, pas $GITHUB_ENV.
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Entrées valides : branche $IN_BRANCH, job $IN_JOB, silence max $((10#$IN_IDLE_MIN)) min"

      - name: Checkout antenly-ci
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - name: Checkout antenly (lecture seule)
        uses: actions/checkout@v4
        with:
          repository: LordThiouk/antenly
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ANTENLY_TOKEN }}
          path: antenly
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout LifeOS (lecture seule)
        uses: actions/checkout@v4
        with:
          repository: LordThiouk/lifeos
          ref: ${{ inputs.lifeos_ref }}
          token: ${{ secrets.LIFEOS_READ_TOKEN }}
          path: lifeos
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v5

      - name: Installer opencode (version de la box)
        run: |
          npm install -g --no-fund --no-audit "opencode-ai@${OPENCODE_VERSION}" >/dev/null 2>&1
          v=$(opencode --version 2>/dev/null | tail -n1)
          [ "$v" = "$OPENCODE_VERSION" ] || { echo "::error::opencode $v au lieu de $OPENCODE_VERSION"; exit 1; }
          echo "opencode $v"

      - name: Installer ripgrep (épinglé, sha256 vérifié)
        run: |
          f="$RUNNER_TEMP/rg.tgz"
          curl -sSfL -o "$f" "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RIPGREP_SHA256}  $f" | sha256sum -c --quiet
          tar -xzf "$f" -C "$RUNNER_TEMP" "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"
          sudo install -m 0755 "$RUNNER_TEMP/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version | head -n1

      # Le hook LifeOS ContextReduction réécrit git/gh en `rtk git ...` / `rtk gh ...`.
      # Sans rtk sur le PATH, chaque commande git/gh du run finissait en exit 127.
      - name: Installer rtk (épinglé, sha256 vérifié)
        run: |
          f="$RUNNER_TEMP/rtk.tgz"
          curl -sSfL -o "$f" "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/rtk-x86_64-unknown-linux-musl.tar.gz"
          echo "${RTK_SHA256}  $f" | sha256sum -c --quiet
          tar -xzf "$f" -C "$RUNNER_TEMP" rtk
          sudo install -m 0755 "$RUNNER_TEMP/rtk" /usr/local/bin/rtk
          rtk --version

      - name: Reconstituer ~/.claude et ~/.config/opencode
        run: |
          set +x
          L="$GITHUB_WORKSPACE/lifeos"
          [ -d "$L/opencode/agent" ] || { echo "::error::lifeos@$IN_LIFEOS_REF sans dossier opencode/"; exit 1; }
          mkdir -p "$HOME/.claude" "$HOME/.config/opencode" "$HOME/.local/share/opencode-lifeos" \
                   "$HOME/.claude/LIFEOS/MEMORY/STATE"
          rsync -a --exclude /.git --exclude /secrets --exclude /opencode "$L/" "$HOME/.claude/"
          # Parité avec la box : ni `rtk hook claude` (rtk absent de la box, ContextReduction.hook.sh
          # couvre déjà git/gh et reste inerte sans rtk) ni hooks http vers localhost:31337
          # (service local absent ; le plugin les compterait en échec à chaque Skill/Agent).
          jq '.hooks |= with_entries(.value |= (map(.hooks |= map(select(
                ((.command // "") != "rtk hook claude")
                and ((.type // "command") != "http" or ((.url // "") | test("^http://localhost:31337/") | not))
              ))) | map(select((.hooks | length) > 0))))' \
            "$L/settings.template.json" > "$HOME/.claude/settings.json"
          [ "$(jq '[.hooks[][].hooks[] | select(.command == "rtk hook claude" or .type == "http")] | length' "$HOME/.claude/settings.json")" = 0 ] \
            || { echo "::error::settings.json : filtrage rtk/http incomplet"; exit 1; }
          (cd "$HOME/.claude" && bun install --silent >/dev/null 2>&1) || echo "::warning::bun install ~/.claude incomplet"
          C="$HOME/.config/opencode"
          cp "$CI_DIR/opencode/config/opencode.json" "$C/opencode.json"
          cp -r "$L/opencode/agent" "$L/opencode/command" "$L/opencode/plugins" "$C/"
          cp "$L/opencode/package.json" "$C/package.json"
          cp "$L/opencode/nix-lifeos.prompt.md" "$HOME/.local/share/opencode-lifeos/"
          (cd "$C" && bun install --silent >/dev/null 2>&1) || { echo "::error::bun install ~/.config/opencode KO"; exit 1; }
          # Modèles : Max sur model_max, tous les autres agents sur model_main.
          for f in "$C"/agent/*.md; do
            m="$OC_MODEL_MAIN"; [ "$(basename "$f")" = "Max.md" ] && m="$OC_MODEL_MAX"
            sed -i -E "0,/^model: .*/s##model: ${m}#" "$f"
          done
          # Les agents générés citent /home/box : lien vers le HOME du runner.
          [ -e /home/box ] || sudo ln -s "$HOME" /home/box
          echo "Config LifeOS/opencode en place"

      - name: Clé d'empreinte ISA
        env:
          ISA_STAMP_KEY: ${{ secrets.ISA_STAMP_KEY }}
        run: |
          set +x
          [ -n "${ISA_STAMP_KEY:-}" ] || { echo "::error::secret ISA_STAMP_KEY absent (acte Papa requis)"; exit 1; }
          echo "::add-mask::$ISA_STAMP_KEY"
          K="$HOME/.claude/LIFEOS/MEMORY/STATE/.isa-stamp-key"
          ( umask 077; printf '%s' "$ISA_STAMP_KEY" > "$K" )
          [ "$(tr -d '\n' < "$K" | wc -c)" -ge 64 ] || { echo "::error::ISA_STAMP_KEY trop courte (64 hex attendus)"; exit 1; }
          echo "Clé ISA écrite (0600)"

      - name: Préparer le dépôt antenly et le prompt
        id: prep
        run: |
          set +x
          cd "$ANTENLY_DIR"
          # shellcheck disable=SC2153 # IN_BRANCH vient de l'env du job
          [ "$(git rev-parse --abbrev-ref HEAD)" = "$IN_BRANCH" ] || git checkout -q -B "$IN_BRANCH" "origin/$IN_BRANCH"
          git config user.name "Nix"
          git config user.email "nix@antenly.local"
          # Aucun remote utilisable par l'IA : le push final ajoute ses propres identifiants.
          printf '#!/bin/sh\necho "push interdit pendant le run opencode" >&2\nexit 1\n' > .git/hooks/pre-push
          chmod +x .git/hooks/pre-push
          mkdir -p "$OC_WORK"
          # SHA de départ en sortie de step : opencode peut écrire dans $GITHUB_ENV, pas ici.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          src="${IN_PROMPT%%:*}"; rel="${IN_PROMPT#*:}"
          if [ "$src" = antenly ]; then root="$ANTENLY_DIR"; else root="$CI_DIR"; fi
          p=$(realpath -e "$root/$rel" 2>/dev/null) || { echo "::error::prompt introuvable"; exit 1; }
          case "$p" in "$root"/*) ;; *) echo "::error::prompt hors du dépôt"; exit 1 ;; esac
          export OC_BRANCH="$IN_BRANCH" OC_JOB="$IN_JOB" OC_REPORT="$OC_WORK/REPORT.md"
          # shellcheck disable=SC2016 # liste de variables pour envsubst, pas une expansion
          envsubst '$ANTENLY_DIR $OC_BRANCH $OC_REPORT $OC_JOB $OC_MODEL_MAIN $OC_MODEL_MAX' \
            < "$CI_DIR/opencode/ci-preamble.md" > "$OC_WORK/prompt.md"
          cat "$p" >> "$OC_WORK/prompt.md"
          echo "Prompt prêt ($(wc -l < "$OC_WORK/prompt.md") lignes), base $(git rev-parse --short HEAD)"

      - name: opencode run (sortie jamais affichée, suivi filtré toutes les 10 min)
        id: oc
        continue-on-error: true
        # Filet seulement : run-fullrun.sh arrête opencode avant (plafond du job - 15 min).
        timeout-minutes: 340
        env:
          OC_JOB: ${{ inputs.job_name }}
          OC_BRANCH: ${{ inputs.branch }}
          OC_PROMPT_FILE: ${{ runner.temp }}/oc/prompt.md
          OC_REPORT: ${{ runner.temp }}/oc/REPORT.md
          OC_LOG: ${{ runner.temp }}/oc/opencode.log
          OC_IDLE_MIN: ${{ inputs.idle_minutes }}
          OC_JOB_T0: ${{ steps.guard.outputs.t0 }}
          # Doit rester égal à timeout-minutes du job (350) ; marge de push : 15 min.
          OC_JOB_TIMEOUT_MIN: "350"
          OC_PUSH_MARGIN_MIN: "15"
          OC_POLL_SEC: "30"
          OC_KILL_GRACE: "60"
          OC_PROGRESS_INTERVAL: "600"
          BASE_SHA: ${{ steps.prep.outputs.base }}
        run: |
          set +x
          # Suivi : lignes [suivi] à valeurs filtrées (liste blanche / nombres), jamais le log lui-même.
          OC_START=$(date +%s); OC_PARENT_PID=$$; export OC_START OC_PARENT_PID
          OC_IDLE_MIN=$((10#$OC_IDLE_MIN)); export OC_IDLE_MIN
          unset OC_IDLE_SEC  # réservé aux tests locaux
          t0="$OC_JOB_T0"; [[ "$t0" =~ ^[0-9]{9,11}$ && "$t0" -le "$OC_START" ]] || t0="$OC_START"
          # opencode doit être arrêté (grâce SIGINT et dernier sondage compris) avant plafond - marge.
          OC_DEADLINE_EPOCH=$(( t0 + (OC_JOB_TIMEOUT_MIN - OC_PUSH_MARGIN_MIN) * 60 - OC_KILL_GRACE - OC_POLL_SEC - 10 ))
          export OC_DEADLINE_EPOCH
          "$CI_DIR/opencode/progress.sh" start || true
          "$CI_DIR/opencode/progress.sh" loop & mon=$!
          # opencode tourne dans sa propre session : une annulation (SIGINT/SIGTERM au step) est
          # relayée au moniteur, qui l'arrête proprement avant les steps de rapport et de push.
          "$CI_DIR/opencode/run-fullrun.sh" & runner=$!
          trap 'kill -TERM "$runner" 2>/dev/null || true' INT TERM
          rc=0; wait "$runner" || rc=$?
          if kill -0 "$runner" 2>/dev/null; then rc=0; wait "$runner" || rc=$?; fi
          trap - INT TERM
          kill "$mon" 2>/dev/null || true; wait "$mon" 2>/dev/null || true
          # Raison décidée ici, d'après le code de sortie du moniteur (pas d'un fichier écrit par l'IA).
          case "$rc" in
            0) stop=ok; why="terminé" ;;
            124) stop=plafond; why="plafond atteint" ;;
            125) stop=silence; why="bloqué (silence ${OC_IDLE_MIN} min)" ;;
            130) stop=annulation; why="annulé" ;;
            *) stop=erreur; why="erreur opencode (code $rc)" ;;
          esac
          echo "stop=$stop" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          "$CI_DIR/opencode/progress.sh" once fin "$stop" || true
          echo "**Arrêt d'opencode : ${why}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "opencode : terminé (code 0)"
          else
            echo "::error::opencode : ${why} ; le travail commité et le journal sont poussés sur la branche par les steps suivants"
            exit 1
          fi

      - name: Rapport, journal privé et contrôles avant push
        id: check
        if: always() && steps.prep.outputs.base != ''
        env:
          OC_OUTCOME: ${{ steps.oc.outcome }}
          OC_STOP: ${{ steps.oc.outputs.stop }}
          OC_IDLE_MIN: ${{ inputs.idle_minutes }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Valeurs du step > $GITHUB_ENV : opencode ne peut ni changer la branche, ni la base,
          # ni injecter BASH_ENV / LD_PRELOAD dans les steps de contrôle et de push.
          IN_BRANCH: ${{ inputs.branch }}
          IN_JOB: ${{ inputs.job_name }}
          BASE_SHA: ${{ steps.prep.outputs.base }}
          OC_WORK: ${{ runner.temp }}/oc
          ANTENLY_DIR: ${{ github.workspace }}/antenly
          CI_DIR: ${{ github.workspace }}/ci
          ISA_STAMP_KEY: ${{ secrets.ISA_STAMP_KEY }}
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set +x
          # PATH fixe : $GITHUB_PATH (écrit par opencode) ne doit pas remplacer git, grep, curl…
          export PATH=/usr/local/bin:/usr/bin:/bin
          # Filet : un opencode encore vivant (step interrompu) ne doit plus écrire pendant les contrôles.
          pkill -KILL -f '(^|[ /])opencode run ' 2>/dev/null || true
          cd "$ANTENLY_DIR"
          # Hooks et fsmonitor du dépôt neutralisés : l'IA a pu les écrire dans .git/config.
          G=(git -c core.hooksPath=/dev/null -c core.fsmonitor=false)
          br=$(git rev-parse --abbrev-ref HEAD)
          [ "$br" = "$IN_BRANCH" ] || { echo "::error::opencode a changé de branche : push refusé"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo "::error::historique réécrit depuis le SHA de départ : push refusé"; exit 1; }
          if git diff --name-only "$BASE_SHA" HEAD | grep -q '^\.github/workflows/'; then
            echo "::error::modification de .github/workflows : push refusé"; exit 1
          fi
          # Travail non commité : conservé dans un commit explicite pour la reprise.
          if [ -n "$("${G[@]}" status --porcelain)" ]; then
            "${G[@]}" add -A
            "${G[@]}" commit -q -m "wip(ci): état non commité à la fin du run $IN_JOB" || true
          fi
          R=".fullrun/${IN_JOB}_DONE.md"
          # Journal : JAMAIS sur la branche de travail ; commit orphelin sur une branche dédiée.
          LOGB="fullrun-logs/${IN_JOB}-${RUN_ID}"
          LOGREL=".fullrun/logs/${IN_JOB}-${RUN_ID}.log"
          # Pas d'écriture à travers un lien symbolique posé par l'IA (ex. vers .git/config).
          for p in .fullrun "$R"; do
            [ ! -L "$p" ] || { echo "::error::lien symbolique inattendu dans .fullrun : push refusé"; exit 1; }
          done
          mkdir -p .fullrun "$OC_WORK"
          # ISC pour la notification : nombres seulement, script lancé sans la clé ISA (avant son écriture sur disque).
          isc=$(env -u ISA_STAMP_KEY OC_LOG="$OC_WORK/opencode.log" OC_START=0 OC_PROMPT_FILE="$OC_WORK/prompt.md" \
                OC_ISA_PATH="${OC_ISA_PATH:-}" BASE_SHA="$BASE_SHA" "$CI_DIR/opencode/progress.sh" isc 2>/dev/null | head -n1)
          [[ "$isc" =~ ^([0-9]{1,7}|\?)/([0-9]{1,7}|\?)$ ]] || isc="?/?"
          # Clé ISA prise du secret (pas du fichier de $HOME, modifiable par l'IA).
          K="$OC_WORK/isa-check.key"; ( umask 077; printf '%s' "${ISA_STAMP_KEY:-}" > "$K" )
          trap 'rm -f "$K" "$OC_WORK/run.diff" "$OC_WORK/log.redacted" "$OC_WORK/log.index"' EXIT
          {
            echo "# Run CI $IN_JOB"
            echo
            echo "- run : $RUN_URL"
            echo "- fin : $(TZ=Africa/Dakar date '+%Y-%m-%d %H:%M') (Dakar)"
            echo "- branche : $IN_BRANCH ; base \`$BASE_SHA\`"
            case "${OC_STOP:-}" in
              ok) echo "- arrêt : terminé" ;;
              silence) echo "- arrêt : bloqué (silence $((10#$OC_IDLE_MIN)) min), opencode arrêté par le garde-fou" ;;
              plafond) echo "- arrêt : plafond atteint, opencode arrêté avant la limite du job" ;;
              annulation) echo "- arrêt : run annulé" ;;
              erreur) echo "- arrêt : erreur opencode" ;;
              *) echo "- arrêt : inconnu (step opencode interrompu)" ;;
            esac
            echo "- opencode : $OC_OUTCOME ; $(tr '\n' ' ' 2>/dev/null < "$OC_WORK/opencode.log.status" || echo 'pas de statut')"
            echo "- modèles : main/Forge $OC_MODEL_MAIN, Max $OC_MODEL_MAX, repli $OC_MODEL_FALLBACK"
            echo "- journal complet : branche \`$LOGB\` (à part, jamais fusionnée ; absente si retirée par le contrôle anti-secrets ; à supprimer après lecture)"
            echo
            echo "## Commits du run"
            git log --format='- %h %s' "$BASE_SHA..HEAD" || true
            echo
            echo "## Rapport de l'agent"
            if [ -s "$OC_WORK/REPORT.md" ]; then cat "$OC_WORK/REPORT.md"; else echo "(aucun rapport écrit : relancer avec le même prompt pour reprendre)"; fi
          } > "$R"
          "${G[@]}" add -- "$R"
          "${G[@]}" commit -q -m "chore(ci): rapport du run $IN_JOB" || true
          # Journal opencode complet (sans ANSI, jetons masqués, 5 Mo max) : un seul commit orphelin
          # (sans parent) sur $LOGB, construit hors de l'arbre de travail.
          log_state="absent"; log_sha=""
          if [ -s "$OC_WORK/opencode.log" ] && OC_ISA_KEY_FILE="$K" "$CI_DIR/opencode/redact-log.sh" "$OC_WORK/opencode.log" "$OC_WORK/log.redacted"; then
            rm -f "$OC_WORK/log.index"
            if blob=$("${G[@]}" hash-object -w --no-filters "$OC_WORK/log.redacted") \
               && GIT_INDEX_FILE="$OC_WORK/log.index" "${G[@]}" update-index --add --cacheinfo "100644,$blob,$LOGREL" \
               && tree=$(GIT_INDEX_FILE="$OC_WORK/log.index" "${G[@]}" write-tree) \
               && log_sha=$(GIT_AUTHOR_NAME=Nix GIT_AUTHOR_EMAIL=nix@antenly.local GIT_COMMITTER_NAME=Nix \
                    GIT_COMMITTER_EMAIL=nix@antenly.local "${G[@]}" commit-tree "$tree" \
                    -m "chore(ci): journal opencode du run $IN_JOB ($RUN_ID) — branche à supprimer après lecture") \
               && "${G[@]}" update-ref "refs/heads/$LOGB" "$log_sha"; then
              log_state="prêt"
            else
              log_sha=""; echo "::warning::commit du journal impossible : journal non poussé"
            fi
          fi
          # Secrets : gitleaks sur les seuls commits du run, sortie jamais affichée.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          # Config et ignores pris au SHA de départ : l'IA ne peut pas assouplir le contrôle.
          cfg=()
          if git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaks.toml" > "$OC_WORK/gitleaks.toml"; cfg=(--config "$OC_WORK/gitleaks.toml")
          fi
          mkdir -p "$OC_WORK/gl-ignore"
          if git cat-file -e "$BASE_SHA:.gitleaksignore" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaksignore" > "$OC_WORK/gl-ignore/.gitleaksignore"
          fi
          # Scan dans un dépôt nu neuf : ni .git/config ni attributs du run (diff.external,
          # textconv…) ne peuvent masquer un contenu à gitleaks ou à la recherche de la clé.
          S="$RUNNER_TEMP/scan.git"
          # snap <branche> <sha attendu>
          snap() {
            rm -rf "$S" && git init -q --bare "$S" \
              && git -C "$S" fetch -q --no-tags "file://$ANTENLY_DIR" "+refs/heads/$1:refs/heads/$1" >/dev/null 2>&1 \
              && [ "$(git -C "$S" rev-parse "refs/heads/$1")" = "$2" ]
          }
          # scan <branche> <sha attendu> <plage> : 0 = propre, 1 = gitleaks, 2 = clé ISA, 3 = copie impossible.
          scan() {
            snap "$1" "$2" || return 3
            "$RUNNER_TEMP/gitleaks" git "${cfg[@]}" --gitleaks-ignore-path "$OC_WORK/gl-ignore" \
              --log-opts="$3" --redact --no-banner \
              --report-path "$OC_WORK/gitleaks.json" "$S" >/dev/null 2>&1 || return 1
            if [ -s "$K" ]; then
              git -C "$S" log -p --binary --no-ext-diff --no-textconv --format= "$3" > "$OC_WORK/run.diff"
              if grep -qiF -- "$(tr -d '\n' < "$K")" "$OC_WORK/run.diff"; then return 2; fi
            fi
            return 0
          }
          why() {
            case "$1" in 2) echo "la clé ISA apparaît" ;; 3) echo "copie de contrôle impossible" ;; *) echo "gitleaks a trouvé un secret probable" ;; esac
          }
          src=0; scan "$IN_BRANCH" "$(git rev-parse HEAD)" "$BASE_SHA..refs/heads/$IN_BRANCH" || src=$?
          [ "$src" -eq 0 ] || { echo "::error::$(why "$src") dans les commits du run : push refusé"; exit 1; }
          if [ -n "$log_sha" ]; then
            src=0; scan "$LOGB" "$log_sha" "refs/heads/$LOGB" || src=$?
            if [ "$src" -ne 0 ]; then
              git update-ref -d "refs/heads/$LOGB" 2>/dev/null || true
              log_sha=""; log_state="retiré (contrôle anti-secrets)"
              echo "::warning::$(why "$src") dans le journal : journal non poussé (le travail l'est)"
            fi
          fi
          {
            echo "commits=$(git rev-list --count "$BASE_SHA..HEAD")"
            echo "head=$(git rev-parse HEAD)"
            echo "log_sha=$log_sha"
            echo "isc=$isc"
          } >> "$GITHUB_OUTPUT"
          lb=""; [ -n "$log_sha" ] && lb=" → branche \`$LOGB\` (antenly, à supprimer après lecture)"
          echo "- Journal opencode privé : ${log_state}${lb}" >> "$GITHUB_STEP_SUMMARY"
          echo "Contrôles OK : $(git rev-list --count "$BASE_SHA..HEAD") commit(s) à pousser ; journal ${log_state}"

      - name: Push sur la branche de fonctionnalité (jamais main, jamais force) et journal à part
        id: push
        if: always() && steps.check.outcome == 'success'
        env:
          PUSH_TOKEN: ${{ secrets.ANTENLY_PUSH_TOKEN }}
          HEAD_SHA: ${{ steps.check.outputs.head }}
          LOG_SHA: ${{ steps.check.outputs.log_sha }}
          IN_BRANCH: ${{ inputs.branch }}
          IN_JOB: ${{ inputs.job_name }}
          RUN_ID: ${{ github.run_id }}
          ANTENLY_DIR: ${{ github.workspace }}/antenly
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set +x
          export PATH=/usr/bin:/bin
          # Mêmes règles que la garde d'entrée, revérifiées ici (la valeur vient de l'entrée, pas de $GITHUB_ENV).
          [[ "$IN_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || { echo "::error::branche invalide : push refusé"; exit 1; }
          case "${IN_BRANCH,,}" in
            main|master|head|refs/*|*..*|*/|*.lock|fullrun-logs/*) echo "::error::branche interdite : push refusé"; exit 1 ;;
          esac
          [[ "$IN_JOB" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ && "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::job ou run invalide : push refusé"; exit 1; }
          LOGB="fullrun-logs/${IN_JOB}-${RUN_ID}"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA contrôlé absent : push refusé"; exit 1; }
          [ -n "${PUSH_TOKEN:-}" ] || { echo "::error::secret ANTENLY_PUSH_TOKEN absent (acte Papa requis)"; exit 1; }
          # Push depuis un dépôt nu neuf : ni .git/config ni ~/.gitconfig (écrits par l'IA) ne s'appliquent.
          B="$RUNNER_TEMP/push.git"; rm -rf "$B"
          env -u PUSH_TOKEN git init -q --bare "$B"
          # copie <branche> <sha contrôlé>
          copie() {
            env -u PUSH_TOKEN git -C "$B" -c protocol.file.allow=always fetch -q --no-tags \
              "file://$ANTENLY_DIR" "+refs/heads/$1:refs/heads/$1" >/dev/null 2>&1 \
              && [ "$(git -C "$B" rev-parse "refs/heads/$1")" = "$2" ]
          }
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # pousse <sha> <branche> : en-tête passé par l'environnement de git seul (pas en argument
          # visible dans ps), env vidé des proxys / GIT_* qu'opencode aurait pu poser ; jamais de force.
          pousse() {
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
              GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null \
              GIT_CONFIG_KEY_1=http.https://github.com/.extraheader GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth" \
              /usr/bin/git -C "$B" push --no-verify --porcelain "https://github.com/LordThiouk/antenly.git" \
              "$1:refs/heads/$2" >/dev/null 2>&1
          }
          work=0
          if ! copie "$IN_BRANCH" "$HEAD_SHA"; then
            echo "::error::la branche a bougé après les contrôles, ou copie locale impossible : push refusé"
          elif pousse "$HEAD_SHA" "$IN_BRANCH"; then
            work=1; echo "Push OK : antenly@$IN_BRANCH → ${HEAD_SHA:0:7}"
          else
            echo "::error::push refusé (branche avancée ailleurs, ou jeton sans droit) : rien n'a été forcé"
          fi
          # Journal : nouvelle branche dédiée (un commit orphelin). Si elle existe déjà, refus (pas de force).
          logp=""
          if [[ "$LOG_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            if copie "$LOGB" "$LOG_SHA" && pousse "$LOG_SHA" "$LOGB"; then
              logp="$LOGB"; echo "Journal privé poussé : antenly@$LOGB"
              echo "- Journal poussé sur la branche \`$LOGB\` d'antenly (à supprimer après lecture)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::journal non poussé sur $LOGB (le travail n'est pas concerné)"
            fi
          fi
          echo "log_branch=$logp" >> "$GITHUB_OUTPUT"
          [ "$work" = 1 ] || exit 1

      - name: Statut final
        if: always()
        env:
          OC_OUTCOME: ${{ steps.oc.outcome }}
          OC_STOP: ${{ steps.oc.outputs.stop }}
          OC_IDLE_MIN: ${{ inputs.idle_minutes }}
        run: |
          case "${OC_STOP:-}" in
            ok) why="terminé" ;;
            silence) why="bloqué (silence $((10#$OC_IDLE_MIN)) min)" ;;
            plafond) why="plafond atteint" ;;
            annulation) why="annulé" ;;
            erreur) why="erreur opencode" ;;
            *) why="non lancé ou interrompu" ;;
          esac
          echo "opencode : ${OC_OUTCOME:-non lancé} ; arrêt : $why"
          echo "- Statut final opencode : **$why**" >> "$GITHUB_STEP_SUMMARY"
          [ "$OC_OUTCOME" = success ] || { echo "::error::run en échec : $why"; exit 1; }

      # Notification de fin vers opencode-notify (même format que oc-run sur la box). Toujours,
      # même après échec ou annulation ; ne fait jamais échouer le job. Contenu neutre : codes,
      # raison, SHA, URL, ISC, modèle ; jamais de texte du modèle. URL et clé passées à curl par
      # stdin (-K -), jamais en argument ni à l'écran ; aucun script du dépôt n'est lancé ici.
      - name: Notification de fin (opencode-notify)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          OC_NOTIFY_URL: ${{ secrets.OC_NOTIFY_URL }}
          OC_NOTIFY_KEY: ${{ secrets.OC_NOTIFY_KEY }}
          JOB_STATUS: ${{ job.status }}
          OC_STOP: ${{ steps.oc.outputs.stop }}
          OC_RC: ${{ steps.oc.outputs.rc }}
          OC_IDLE_MIN: ${{ inputs.idle_minutes }}
          OC_JOB_T0: ${{ steps.guard.outputs.t0 }}
          IN_JOB: ${{ inputs.job_name }}
          OC_MODEL_MAIN: ${{ inputs.model_main }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          LOG_BRANCH: ${{ steps.push.outputs.log_branch }}
          HEAD_SHA: ${{ steps.check.outputs.head }}
          ISC: ${{ steps.check.outputs.isc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
        run: |
          set +x
          export PATH=/usr/bin:/bin
          if [ -z "${OC_NOTIFY_URL:-}" ] || [ -z "${OC_NOTIFY_KEY:-}" ]; then
            echo "::warning::secrets OC_NOTIFY_URL / OC_NOTIFY_KEY absents : notification ignorée"; exit 0
          fi
          case "${OC_STOP:-}" in
            silence) status="bloqué"; why="bloqué (silence $((10#$OC_IDLE_MIN)) min)" ;;
            plafond) status="échec"; why="plafond atteint" ;;
            annulation) status="annulé"; why="annulé" ;;
            erreur) status="échec"; why="erreur opencode" ;;
            ok) status="fini"; why="terminé" ;;
            *) status="échec"; why="opencode non lancé ou interrompu" ;;
          esac
          if [ "$JOB_STATUS" = cancelled ] && [ "$status" != "annulé" ]; then status="annulé"; why="annulé ($why)"; fi
          [ "$JOB_STATUS" = success ] || [ "$status" != fini ] || { status="échec"; why="terminé, mais contrôles ou push en échec"; }
          now=$(date +%s); t0="$OC_JOB_T0"
          [[ "$t0" =~ ^[0-9]{9,11}$ && "$t0" -le "$now" ]] && dur=$(( now - t0 )) || dur=0
          [[ "$OC_RC" =~ ^[0-9]{1,3}$ ]] || OC_RC="?"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PUSH_OUTCOME" = success ]] && sha="${HEAD_SHA:0:7}" || sha="aucun"
          [[ "$ISC" =~ ^([0-9]{1,7}|\?)/([0-9]{1,7}|\?)$ ]] || ISC="?/?"
          [[ "$LOG_BRANCH" =~ ^fullrun-logs/[A-Za-z0-9._-]{1,90}$ ]] || LOG_BRANCH="aucun"
          tail="exit=${OC_RC} · raison=${why} · sha poussé=${sha} · journal=${LOG_BRANCH} · ISC ${ISC} · modèle ${OC_MODEL_MAIN} · run ${RUN_URL}"
          id=$(printf '%s:%s:%s:%s' "$IN_JOB" "$RUN_ID" "$RUN_ATTEMPT" "$status" | sha256sum | cut -d' ' -f1)
          body="$RUNNER_TEMP/notify.json"
          jq -nc --arg job "$IN_JOB" --arg status "$status" --argjson duration "$dur" --arg log_tail "$tail" \
            --arg event_id "$id" --arg run_id "$RUN_ID" \
            '{job:$job,status:$status,duration:$duration,pr_url:"",log_tail:$log_tail,event_id:$event_id,run_id:$run_id}' > "$body"
          ok=0
          for attempt in 1 2 3; do
            code=$(printf 'url = "%s"\nheader = "Authorization: Bearer %s"\nheader = "X-Automation-Key: %s"\n' \
                     "$OC_NOTIFY_URL" "$OC_NOTIFY_KEY" "$OC_NOTIFY_KEY" \
                   | curl -sS -K - --max-time 15 -X POST -H "Content-Type: application/json" -H "Idempotency-Key: $id" \
                       --data-binary "@$body" -o /dev/null -w '%{http_code}' 2>/dev/null) || code="000"
            if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then ok=1; break; fi
            echo "notification : essai $attempt, HTTP ${code:0:3}"
            [ "$attempt" -lt 3 ] && sleep $(( attempt * 10 ))
          done
          rm -f "$body"
          if [ "$ok" = 1 ]; then echo "notification envoyée : $why"; else echo "::warning::notification non livrée après 3 essais (le job garde son statut)"; fi
