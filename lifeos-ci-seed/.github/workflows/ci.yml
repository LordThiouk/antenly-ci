name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AGE_VERSION: "1.2.1"
  AGE_SHA256: "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # done_check.sh lit le verdict via le CLI lifeos (source unique, LIFEOS/TOOLS/FullRunVerdict.ts) :
      # les tests qui font tourner le vrai done_check.sh en ont besoin. Dépôt privé : CI_TOKEN, lecture seule.
      - name: Checkout LifeOS (lecture seule, CLI de verdict)
        uses: actions/checkout@v4
        with:
          repository: LordThiouk/lifeos
          # Épinglé : lifeos#24 mergée (4fac2d5 : préflight + CLI de verdict de #23). Un `main` mouvant changerait le verdict sous nos pieds.
          ref: 4fac2d59de94bf6a5fa6c68c7f09874a2f9cd634
          token: ${{ secrets.CI_TOKEN }}
          path: lifeos
          persist-credentials: false

      - name: Installer ShellCheck si absent
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version | head -2

      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck -x opencode/*.sh targets/*.sh

      # ripgrep n'est plus fourni par l'image ubuntu-latest : les tests shell l'appellent (rg -q), et le step
      # extrait par preflight-test.sh tourne avec PATH=/usr/bin:/bin, d'où apt (binaire dans /usr/bin).
      - name: Installer ripgrep (tests shell)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep && rg --version | head -1

      - name: Installer actionlint (binaire officiel épinglé)
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl -sSfL -o "$RUNNER_TEMP/${archive}" "${base}/${archive}"
          (cd "$RUNNER_TEMP" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP" actionlint
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          actionlint --version

      - name: Actionlint
        run: |
          set -euo pipefail
          actionlint -ignore 'SC2129' .github/workflows/*.yml

      - name: Setup bun (épinglé par SHA)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Chiffrement du journal opencode quand les contrôles refusent le push : sans age, le
      # journal disparaît avec le runner et personne ne sait ce que l'agent a fait.
      - name: Installer age (épinglé, sha256 vérifié)
        run: |
          f="$RUNNER_TEMP/age.tgz"
          curl -sSfL -o "$f" "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $f" | sha256sum -c --quiet
          tar -xzf "$f" -C "$RUNNER_TEMP" age/age age/age-keygen
          sudo install -m 0755 "$RUNNER_TEMP/age/age" /usr/local/bin/age
          sudo install -m 0755 "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/age-keygen
          age --version

      # Marqueur root (non inscriptible) sans lequel done_check.sh refuse le mode test sous GITHUB_ACTIONS :
      # posé ici pour la seule suite de tests, jamais par opencode-fullrun.yml.
      - name: Marqueur root du mode test (suite de tests seulement)
        run: sudo install -o root -g root -m 0644 /dev/null /etc/fullrun-done-test-mode

      # ffmpeg/ffprobe : le banc fingerprint décode des .opus. Même schéma que ci.yml
      # (binaire statique épinglé, secours apt). Échec franc si l'un des deux manque.
      - name: ffmpeg (binaire statique, sans miroirs Ubuntu)
        id: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        continue-on-error: true
        timeout-minutes: 10
        with:
          ffmpeg-version: release
      - name: ffmpeg (secours apt)
        if: steps.ffmpeg.outcome != 'success'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Vérifier ffmpeg et ffprobe
        run: |
          command -v ffmpeg >/dev/null || { echo "::error::ffmpeg absent du PATH"; exit 1; }
          command -v ffprobe >/dev/null || { echo "::error::ffprobe absent du PATH"; exit 1; }
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Tests shell
        if: ${{ !cancelled() }}
        env:
          OC_VERDICT_CLI: ${{ github.workspace }}/lifeos/LIFEOS/TOOLS/FullRunVerdict.ts
          # Bout en bout du préflight avec le vrai CLI lifeos (pin ci-dessus, contient lifeos#24) : son absence
          # fait échouer preflight-test.sh au lieu d'un SKIP.
          LIFEOS_DIR: ${{ github.workspace }}/lifeos
          OC_REQUIRE_PREFLIGHT_E2E: "1"
          OC_REQUIRE_PROD_TESTS: "1"
        run: |
          set -euo pipefail
          bash opencode/tests/run-all.sh
